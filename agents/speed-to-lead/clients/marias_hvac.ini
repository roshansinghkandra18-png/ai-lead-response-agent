# -------------------------------------------------------------------------
# A SECOND CLIENT, deliberately different from Joe's Plumbing in every setting.
#
# This exists so the tests prove the agent actually reads the settings file,
# rather than having Joe's rules quietly baked into the code.
#
# Maria works Saturdays, starts earlier, finishes later, gives 3-hour arrival
# windows, needs only 2 hours notice, and wants 3 options offered instead of 2.
# -------------------------------------------------------------------------

[business]
name = Maria's Heating & Air
owner_email = maria@mariashvac.com


[hours]
# Maria is in Texas, so a different zone from Joe. This also proves the agent
# reads the setting rather than assuming everyone is on the east coast.
timezone = America/Chicago

working_days = mon,tue,wed,thu,fri,sat
start = 07:00
end = 19:00

# Maria stops for lunch every day. Joe doesn't - so between the two clients,
# both the "has a lunch break" and "doesn't" paths get tested.
lunch_start = 12:00
lunch_end = 13:00


[holidays]
# Maria closes for fewer days than Joe, and takes an extra week off in August.
observed = new years,independence day,thanksgiving,christmas
extra = 08/24/2026,08/25/2026


[booking]
window_hours = 3
minimum_notice_hours = 2
max_offers_per_day = 2
options_to_offer = 3


[questions]
missing_address = What's the full service address?
missing_urgency = is this an emergency or can it wait?


[emergency]
words = emergency,no heat,no cooling,gas leak,carbon monoxide,burst,flooding,urgent,asap
