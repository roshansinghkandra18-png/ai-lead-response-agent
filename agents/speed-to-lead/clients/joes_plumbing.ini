# -------------------------------------------------------------------------
# CLIENT SETTINGS  --  one file like this per client.
#
# To add a new client: copy this file, rename it (e.g. miller_plumbing.ini),
# and change the values. You never need to touch any code.
#
# Lines starting with # are notes to yourself. The agent ignores them.
# -------------------------------------------------------------------------

[business]
name = Joe's Plumbing

# Where alerts go when the agent needs a human. Not used yet -- we print to
# the screen while building -- but fill it in now so it's ready.
owner_email = joe@joesplumbing.com


[hours]
# WHERE the client is. Everything about times is worked out in THIS zone, not
# in whatever zone your own laptop happens to be in.
#
# Common US ones:
#   America/New_York    Eastern  (NY, FL, OH, GA...)
#   America/Chicago     Central  (TX, IL, MN...)
#   America/Denver      Mountain (CO, UT...)
#   America/Phoenix     Arizona  (does not change for daylight saving)
#   America/Los_Angeles Pacific  (CA, WA, OR...)
timezone = America/New_York

# Which days he works. Three-letter short names, separated by commas.
working_days = mon,tue,wed,thu,fri

# His working day, in 24-hour time. 17:00 means 5pm.
start = 08:00
end = 17:00

# Lunch break. Leave both blank if he doesn't take one at a fixed time.
# The agent will never offer a window that runs through this.
lunch_start = 12:00
lunch_end = 13:00


[travel]
# WHERE HE STARTS FROM. His yard, his home, wherever the van sleeps.
# Used for two different things:
#   - the first job of the day is measured from here
#   - "is this customer in my area?" is ALWAYS measured from here, so the same
#     address never gets accepted on Monday and refused on Friday
base_zip = 44113

# HOW FAR HE IS WILLING TO GO. Past this, the agent tells the customer
# politely that they're outside the area instead of booking a job he'll
# resent. Ask every client -- a city plumber and a county one differ hugely.
#
# Joe will happily drive an hour to an hour and a half for a job. Set too low
# and the agent quietly turns away the outer suburbs, which is where a lot of
# the best-paying work is.
max_travel_minutes = 90

# How fast he actually gets around, averaged over a working day.
#   25 = dense city (Chicago, Boston)
#   30 = town centre only -- traffic lights, parking, the usual
#   40 = town plus suburbs, where the longer runs use highways
#
# Set to 30 first and it was WRONG. Bay Village is 15 miles from downtown
# Cleveland and takes about 20 minutes on I-90; at 30mph the agent thought it
# was 35 minutes and turned the customer away. The longer a plumber's trip,
# the more of it is highway.
average_speed_mph = 40

# Roads bend, rivers need bridges, nobody drives through buildings. The
# straight-line distance gets multiplied by this. 1.3 is the usual US rule.
road_factor = 1.3

# Used when we can't work out a real distance -- the customer left the zip
# off, or the plumber's own calendar entry has no address on it. A sensible
# standard gap beats a made-up number.
default_minutes = 30


[holidays]
# Public holidays this client closes for. Ask on the onboarding call.
# The agent works out the dates itself every year, so this never needs updating.
#
# Choose from: new years, mlk day, presidents day, memorial day, juneteenth,
#              independence day, labor day, columbus day, veterans day,
#              thanksgiving, day after thanksgiving, christmas eve, christmas,
#              new years eve
observed = new years,memorial day,independence day,labor day,thanksgiving,christmas

# Any other days off - his holiday, a family wedding. Written MM/DD/YYYY,
# separated by commas. Leave blank if none.
extra =

[booking]
# How long each arrival window is. Plumbers promise "between 2 and 4",
# not "at 2:00".
#
# Two hours is the trade norm, but Joe uses ONE. A window is a promise about
# when he TURNS UP, not when he finishes -- so the agent has to assume he
# arrives at the very last moment it allows. A wider window means more of his
# day held back waiting. One hour hands him back roughly an hour per job.
# The trade-off: a tighter window is easier to miss in traffic.
window_hours = 1

# His chance to SEE a job and say no, before a customer is waiting for him.
#
# This is NOT a travel allowance -- travel is worked out separately, from the
# customer's address. This number is only about how long it takes him to look
# at his phone.
#
# It used to be 4 hours, which quietly cost him whole afternoons: a customer
# emailing at 1pm got pushed past his 5pm finish and lost the same-day job
# entirely. Now the agent reads his diary and knows the drive times, 1 hour is
# enough warning. Ask each client -- answer 4 if he works long stretches
# underground, 1 if he checks his phone between jobs.
#
# After he taps "done" on a job this does not apply at all: he has just proved
# he is looking at his phone.
minimum_notice_hours = 1

# What times an appointment is allowed to START at.
#   60 = on the hour only        -- "between 11 and 12"
#   30 = every half hour         -- "between 10:30 and 11:30"
#   15 = every quarter hour      -- "between 10:15 and 11:15", reads robotic
#
# This is not a law, it is a choice. The wider the step, the more of his day
# gets thrown away waiting: free at 10:30 but rounded to 11 is half an hour
# he could have been earning in.
appointment_every_minutes = 30

# The most windows the agent will offer on any single day. Keeps a mistake
# in these settings from ruining a whole week instead of one day.
max_offers_per_day = 3

# How many choices to give the customer in one email. Two feels helpful.
# More starts to feel like a form.
options_to_offer = 2


[questions]
# Asked ONLY when the customer's form didn't already tell us.
#
# THE ADDRESS COMES FIRST. If we don't know where they are, the agent asks
# this and offers NO appointment times at all. It cannot work out how long
# it takes Joe to drive there, and it cannot check they're even in his area,
# until it has a street address. Offering a time first and asking where they
# live afterwards is how you promise somebody a slot you can't keep.
#
# Write it as a full sentence -- it stands on its own in the email.
missing_address = What's your full street address?

# Asked only when we DO have an address and just need the urgency. This one
# gets tacked on after the times, as "Also, ...".
missing_urgency = how soon do you need this?


[emergency]
# If any of these words appear, the agent does NOT offer times. It alerts the
# plumber to call immediately, because a flooding basement should never get a
# polite "would Wednesday suit you?"
words = emergency,flood,flooding,burst,gushing,no water,gas leak,sewage,overflowing,urgent,asap
