# -------------------------------------------------------------------------
# CLIENT SETTINGS  --  one file like this per client.
#
# To add a new client: copy this file, rename it (e.g. miller_plumbing.ini),
# and change the values. You never need to touch any code.
#
# Lines starting with # are notes to yourself. The agent ignores them.
# -------------------------------------------------------------------------

[business]
name = Joe's Plumbing

# Where alerts go when the agent needs a human. Not used yet -- we print to
# the screen while building -- but fill it in now so it's ready.
owner_email = joe@joesplumbing.com


[hours]
# Which days he works. Three-letter short names, separated by commas.
working_days = mon,tue,wed,thu,fri

# His working day, in 24-hour time. 17:00 means 5pm.
start = 08:00
end = 17:00

[booking]
# How long each arrival window is. Plumbers promise "between 2 and 4",
# not "at 2:00". Two hours is the trade norm.
window_hours = 2

# How far ahead the earliest offer can be. He's under a sink right now and
# won't check his phone for a while -- 4 hours stops the agent booking him
# into the job he is already doing.
minimum_notice_hours = 4

# The most windows the agent will offer on any single day. Keeps a mistake
# in these settings from ruining a whole week instead of one day.
max_offers_per_day = 3

# How many choices to give the customer in one email. Two feels helpful.
# More starts to feel like a form.
options_to_offer = 2


[questions]
# Asked ONLY when the customer's form didn't already tell us.
# Never both at once -- the agent picks the more useful one.
missing_address = what's your zip code?
missing_urgency = how soon do you need this?


[emergency]
# If any of these words appear, the agent does NOT offer times. It alerts the
# plumber to call immediately, because a flooding basement should never get a
# polite "would Wednesday suit you?"
words = emergency,flood,flooding,burst,gushing,no water,gas leak,sewage,overflowing,urgent,asap
